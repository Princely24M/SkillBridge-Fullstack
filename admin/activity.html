<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Activity | SkillBridge</title>
  <meta name="description" content="Audit logs and operational activity for the SkillBridge admin dashboard." />
  <link rel="icon" type="image/svg+xml" href="../images/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body data-admin-page="activity">
  <div class="admin-shell">
    <aside class="admin-sidebar" aria-label="Admin navigation">
      <div class="admin-sidebar-header">
        <a href="../index.html" class="brand-link" aria-label="SkillBridge home"><img src="../images/logo.svg" alt="SkillBridge logo" class="brand-logo-img" /></a>
        <span class="admin-side-label">Admin</span>
      </div>
      <nav class="admin-nav">
        <a href="dashboard.html">Overview</a>
        <a href="opportunities.html">Opportunities</a>
        <a href="users.html">Users</a>
        <a href="reports.html">Reports</a>
        <a class="active" href="activity.html">Activity</a>
        <a href="settings.html">Settings</a>
      </nav>
      <div class="admin-sidebar-footer">
        <button class="btn btn-secondary btn-block" type="button" data-admin-logout>Log out</button>
      </div>
    </aside>
    <div class="admin-page">
      <header class="admin-topbar">
        <div>
          <p class="admin-kicker">Activity</p>
          <h1>Audit log</h1>
        </div>
        <div class="admin-header-actions">
          <button class="btn btn-secondary" type="button" data-theme-toggle>Theme</button>
          <span class="admin-status-pill" data-admin-role>Admin</span>
        </div>
      </header>
      <main class="admin-content">
        <section class="admin-panel">
          <div class="admin-panel-header">
            <h2>Administrative audit history</h2>
            <button class="btn btn-secondary" type="button" data-audit-refresh>Refresh</button>
          </div>
          <div class="admin-form-grid audit-filter-grid" aria-label="Audit filters">
            <div class="admin-form-row">
              <label for="audit-range">Date range</label>
              <select id="audit-range" data-audit-range>
                <option value="30d">Last 30 days</option>
                <option value="today">Today</option>
                <option value="7d">Last 7 days</option>
                <option value="90d">Last 90 days</option>
                <option value="custom">Custom range</option>
                <option value="all">All time</option>
              </select>
            </div>
            <div class="admin-form-row" data-audit-custom hidden>
              <label for="audit-from">From</label>
              <input id="audit-from" type="date" data-audit-from />
            </div>
            <div class="admin-form-row" data-audit-custom hidden>
              <label for="audit-to">To</label>
              <input id="audit-to" type="date" data-audit-to />
            </div>
            <div class="admin-form-row">
              <label for="audit-actor">Administrator</label>
              <select id="audit-actor" data-audit-actor>
                <option value="">All administrators</option>
              </select>
            </div>
            <div class="admin-form-row">
              <label for="audit-action">Action</label>
              <select id="audit-action" data-audit-action>
                <option value="">All actions</option>
                <option value="user.created">User created</option>
                <option value="user.updated">User updated</option>
                <option value="user.role_changed">Role changed</option>
                <option value="user.status_changed">Account status changed</option>
                <option value="user.deleted">User deleted</option>
                <option value="opportunity.created">Opportunity created</option>
                <option value="opportunity.updated">Opportunity updated</option>
                <option value="opportunity.status_changed">Opportunity status changed</option>
                <option value="opportunity.deleted">Opportunity deleted</option>
              </select>
            </div>
            <div class="admin-form-row">
              <label for="audit-resource">Resource</label>
              <select id="audit-resource" data-audit-resource>
                <option value="">All resources</option>
                <option value="user">Users</option>
                <option value="opportunity">Opportunities</option>
              </select>
            </div>
            <div class="admin-form-row">
              <label for="audit-status">Result</label>
              <select id="audit-status" data-audit-status>
                <option value="">All results</option>
                <option value="success">Successful</option>
                <option value="failure">Failed</option>
              </select>
            </div>
            <div class="admin-form-row audit-search-row">
              <label for="audit-search">Search history</label>
              <input id="audit-search" type="search" maxlength="100" placeholder="Description, resource or ID" data-audit-search />
            </div>
          </div>
          <div class="admin-panel-header audit-toolbar">
            <span class="admin-panel-meta" data-audit-total aria-live="polite"></span>
            <button class="btn btn-secondary btn-small" type="button" data-audit-clear>Clear filters</button>
          </div>
          <p class="auth-message" data-audit-message role="alert" aria-live="polite" hidden></p>
          <div class="admin-table-wrap">
            <table class="admin-table audit-table">
              <thead>
                <tr>
                  <th>Date and time</th>
                  <th>Administrator</th>
                  <th>Action</th>
                  <th>Resource</th>
                  <th>Description</th>
                  <th>Result</th>
                  <th>Details</th>
                </tr>
              </thead>
              <tbody data-admin-activity>
                <tr><td colspan="7">Loading audit history…</td></tr>
              </tbody>
            </table>
          </div>
          <div class="admin-panel-header audit-toolbar">
            <span class="admin-panel-meta" data-audit-page-info></span>
            <div class="table-actions">
              <button class="btn btn-secondary btn-small" type="button" data-audit-prev>Previous</button>
              <button class="btn btn-secondary btn-small" type="button" data-audit-next>Next</button>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>
  <dialog class="admin-panel audit-detail-dialog" data-audit-dialog aria-labelledby="audit-dialog-title">
    <div class="admin-panel-header">
      <h2 id="audit-dialog-title">Audit event details</h2>
      <button class="btn btn-secondary btn-small" type="button" data-audit-close>Close</button>
    </div>
    <div data-audit-details></div>
  </dialog>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/api.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
