<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Opportunities | SkillBridge</title>
  <meta name="description" content="Manage incoming and published opportunities from the admin dashboard." />
  <link rel="icon" type="image/svg+xml" href="../images/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body data-admin-page="opportunities">
  <div class="admin-shell">
    <aside class="admin-sidebar" aria-label="Admin navigation">
      <div class="admin-sidebar-header">
        <a href="../index.html" class="brand-link" aria-label="SkillBridge home"><img src="../images/logo.svg" alt="SkillBridge logo" class="brand-logo-img" /></a>
        <span class="admin-side-label">Admin</span>
      </div>
      <nav class="admin-nav">
        <a href="dashboard.html">Overview</a>
        <a class="active" href="opportunities.html">Opportunities</a>
        <a href="users.html">Users</a>
        <a href="reports.html">Reports</a>
        <a href="activity.html">Activity</a>
        <a href="settings.html">Settings</a>
      </nav>
      <div class="admin-sidebar-footer">
        <button class="btn btn-secondary btn-block" type="button" data-admin-logout>Log out</button>
      </div>
    </aside>

    <div class="admin-page">
      <header class="admin-topbar">
        <div>
          <p class="admin-kicker">Opportunities</p>
          <h1>Manage listings</h1>
        </div>
        <div class="admin-header-actions">
          <button class="btn btn-secondary" type="button" data-theme-toggle>Theme</button>
          <span class="admin-status-pill" data-admin-role>Admin</span>
        </div>
      </header>

      <main class="admin-content">
        <section class="admin-panel">
          <div class="admin-panel-header">
            <h2>Opportunity management</h2>
          </div>

          <form id="admin-opportunity-form" class="admin-opportunity-form">
            <input id="opportunity-id" name="id" type="hidden" />
            <div class="admin-form-grid">
              <div class="admin-form-row">
                <label for="opportunity-title">Title</label>
                <input id="opportunity-title" name="title" type="text" required />
              </div>
              <div class="admin-form-row">
                <label for="opportunity-organisation">Organisation</label>
                <input id="opportunity-organisation" name="organisation" type="text" required />
              </div>
              <div class="admin-form-row">
                <label for="opportunity-category">Category</label>
                <input id="opportunity-category" name="category" type="text" required />
              </div>
              <div class="admin-form-row">
                <label for="opportunity-location">Location</label>
                <input id="opportunity-location" name="location" type="text" required />
              </div>
              <div class="admin-form-row">
                <label for="opportunity-experience">Experience level</label>
                <input id="opportunity-experience" name="experience_level" type="text" value="Varies" />
              </div>
              <div class="admin-form-row">
                <label for="opportunity-closing-date">Closing date</label>
                <input id="opportunity-closing-date" name="closing_date" type="date" />
              </div>
              <div class="admin-form-row admin-form-span-2">
                <label for="opportunity-description">Description</label>
                <textarea id="opportunity-description" name="description" rows="4" required></textarea>
              </div>
              <div class="admin-form-row admin-form-span-2">
                <label for="opportunity-application">Application instructions</label>
                <textarea id="opportunity-application" name="application_instructions" rows="3"></textarea>
              </div>
              <div class="admin-form-row admin-form-span-2">
                <label for="opportunity-url">Official application URL</label>
                <input id="opportunity-url" name="official_application_url" type="url" />
              </div>
              <div class="admin-form-row">
                <label for="opportunity-source">Source name</label>
                <input id="opportunity-source" name="source_name" type="text" />
              </div>
              <div class="admin-form-row">
                <label for="opportunity-status">Status</label>
                <select id="opportunity-status" name="status">
                  <option value="draft">Draft</option>
                  <option value="active">Active</option>
                  <option value="pending">Pending</option>
                </select>
              </div>
              <div class="admin-form-row admin-form-checkbox">
                <label for="opportunity-verified">
                  <input id="opportunity-verified" name="is_verified" type="checkbox" checked />
                  Mark as verified
                </label>
              </div>
            </div>
            <div class="admin-form-actions">
              <button class="btn btn-primary" type="submit">Create opportunity</button>
            </div>
            <p id="admin-opportunity-message" class="admin-form-message" aria-live="polite"></p>
          </form>
        </section>

        <section class="admin-panel">
          <div class="admin-panel-header">
            <h2>Current listings</h2>
          </div>
          <div class="admin-table-wrap">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Title</th>
                  <th>Organisation</th>
                  <th>Status</th>
                  <th>Verification</th>
                  <th>Closing date</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody data-admin-opportunities>
                <tr><td colspan="5">Loading opportunities…</td></tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/api.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
